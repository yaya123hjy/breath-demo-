<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的呼吸灯</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #4CAF50;
            margin: 20px auto;
            animation: breathe 2s infinite alternate;
        }
        @keyframes breathe {
            from { transform: scale(1); opacity: 0.7; }
            to { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎来到我的网页！</h1>
        <div class="circle"></div>
        <p>看，它开始呼吸了！</p>
    </div>
</body>
</html>
